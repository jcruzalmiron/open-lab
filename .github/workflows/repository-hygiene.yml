name: Repository hygiene

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  required-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check organization blueprint
        shell: bash
        run: |
          test -f README.md
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -f docs/arquitectura.md
          test -d open-lab
          test -d project-template
