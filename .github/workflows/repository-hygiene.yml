name: Repository hygiene

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  required-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check open lab blueprint
        shell: bash
        run: |
          test -f README.md
          test -f AGENTS.md
          test -f CODEX.md
          test -f CLAUDE.md
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -f docs/arquitectura.md
          test -f docs/birria-ecolabs.md
          test -d open-lab
          test -f open-lab/birria-ecolabs/primer-ecolab/README.md
          test -f open-lab/birria-ecolabs/primer-ecolab/assets/qr-primer-ecolab.png
          test -f open-lab/birria-ecolabs/primer-ecolab/01-guia-residuos/README.md
          test -f open-lab/birria-ecolabs/primer-ecolab/02-comunicacion-ambiental/README.md
          test -f open-lab/birria-ecolabs/primer-ecolab/03-lluvias-anegamientos/README.md
          test -d project-template
